<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
    <title>My Resume</title>
  
    <link rel="shortcut icon" type="image/x-icon" href="FileIcon.png">
  	<style>
    	body{
	  	overflow: hidden;
	  	margin: 0;
	  	padding: 0;
	  	min-height: 100dvh;
	  
	  	display: flex;
	  	flex-direction: column;
	  	justify-content: center;
	  	align-items: center;
	  
	  	background-image: url("gif-speed.gif");
	 	background-repeat: no-repeat;
	  	background-size: cover;
	  	background-position: center;
	  	background-attachment: fixed;
    	}

    	.iframe-container {
			width: 100dvw;
			height: 70dvh;
			display: flex;
			justify-content: center;
			align-items: center;
		}
	
		.iframe-window {
			width: 60%;
			height: 70dvh;
			border: 5px solid black;
			box-sizing: border-box;
		}
	
		.textbox {
			width: 80vw;
			max-width: 1200px;
			height: 12vh; 
			min-height: 80px;
			margin: 2vh 0;
		
			display: flex;
			justify-content: center;
			align-items: center;
			text-align: center;
		
			font-family: 'Boldo', sans-serif;
			font-size: clamp(32px, 5cqw, 40px);
			text-align: center;
			color: #FFFFFF;
		
			padding: 20px;
			border: 5px solid black;
			border-radius: 18px;
			background-color: rgba(0, 0, 0, 0.2);		
			backdrop-filter: blur(5px);
			-webkit-backdrop-filter: blur(5px);
		}
	
		@font-face {
			font-family: 'Boldo';
			src: url("BoldodemoRegular-Wp6wE.otf") format("opentype");
			font-weight: normal;
			font-style: normal;
			font-display: swap;
		}
	
		.gradient-text-custom {
			/* Font styling */
			font-family: 'Boldo', sans-serif;
			font-weight: bold;

			/* Gradient effect */
			background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 25%, #667eea 75%, #89f7fe 100%);
			background-size: 200% auto;
			-webkit-background-clip: text;
			background-clip: text;
			-webkit-text-fill-color: transparent;
			color: transparent;
		
			animation: shiftGradient 4s linear infinite;
			display: inline-block;
		}

		@keyframes shiftGradient {
  			0% {
    			background-position: 0% center;
  			}
  			100% {
    			background-position: 200% center;
  			}
		}
	</style>
  </head>
  
  <body>
  
	<div class="textbox"> <h3 class="gradient-text-custom">Akira Evanson's Resume</h3> </div>
		
	<div class="iframe-container">
		<embed class="iframe-window" src="Akira-Evanson-Resume3(1).pdf" type="application/pdf" title="PDF Viewer"/>
			<p>Your browser doesn't support inline PDFs. 
     			<a href="Akira-Evanson-Resume3(1).pdf">Click here to download the PDF file.</a>
			</p>
	</div>

  </body>

</html>
